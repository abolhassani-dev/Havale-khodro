# Whether *this* request should be sent to HTTPS.
#
# 00-mode.conf says whether HTTPS is live at all ($force_https, flipped by
# enable-ssl.sh). But the redirect lines live in site.inc, which the HTTPS
# server includes too — and a 443 server that redirects to https:// is a
# loop. So the decision is «HTTPS is live AND this arrived over plain HTTP»,
# folded into one variable the locations can test.
#
# Loaded after 00-mode.conf (01-), because a map may only refer to variables
# already defined.
map "$scheme:$force_https" $go_https {
    "http:1" 1;
    default  0;
}
