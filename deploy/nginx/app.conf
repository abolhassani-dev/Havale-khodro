# nginx in front of everything.
#
# Serves the frontend as static files and proxies only /api to Node. Routing
# stylesheets and fonts through the application would put the event loop in the
# path of every asset request for no benefit.
#
# HTTP only, deliberately. TLS is added by uncommenting the block at the bottom
# once certbot has issued a certificate — nginx refuses to start when told to
# load a certificate file that does not exist yet, which would leave the whole
# system down during the one step where you most want it up.

upstream api {
    server api:3000;
    keepalive 32;
}

# Requests arriving with a hostname nobody configured — usually a scanner
# walking IP ranges. Answering them with the application invites attention;
# closing the connection costs nothing.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    # Both the IP and the domain, so the system is reachable before DNS is set
    # up and keeps working afterwards.
    server_name feranocar.com www.feranocar.com 45.94.213.252;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;
    server_tokens off;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Where certbot proves the domain is yours. Must stay above the catch-all
    # location, or the SPA fallback would swallow the challenge and no
    # certificate would ever issue.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---- security headers ----
    #
    # The policy is the second line of defence behind the escaping in
    # ui/html.js: even if a script tag were injected, the browser would refuse
    # to run it. `unsafe-inline` is absent from script-src on purpose — nothing
    # in this frontend uses an inline script or an onclick attribute, so
    # allowing them would weaken this for no gain.
    #
    # style-src keeps 'unsafe-inline' because the markup uses a few inline style
    # attributes. Those cannot execute code.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # No third-party embedding. Clickjacking a "suspend account" button is easy
    # money, and this panel has no business inside anyone else's page.
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /api/v1/health {
        proxy_pass http://api/api/v1/health;
        access_log off;
    }

    # Assets never change under the same name, so they can be held for a year.
    # The font alone is 110 KB that should be fetched once per browser.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application code changes on every deploy. Caching it would mean an agency
    # running last week's interface against this week's API.
    location /src/ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

