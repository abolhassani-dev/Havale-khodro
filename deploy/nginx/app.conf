# nginx in front of everything.
#
# Serves the frontend as static files and proxies only /api to Node. Routing
# stylesheets and fonts through the application would put the event loop in the
# path of every asset request for no benefit.
#
# HTTP only, deliberately. TLS is added by uncommenting the block at the bottom
# once certbot has issued a certificate — nginx refuses to start when told to
# load a certificate file that does not exist yet, which would leave the whole
# system down during the one step where you most want it up.

upstream api {
    server api:3000;
    keepalive 32;
}

# Requests arriving with a hostname nobody configured — usually a scanner
# walking IP ranges. Answering them with the application invites attention;
# closing the connection costs nothing.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    # The domain, the IP, and localhost. The IP so the system is reachable
    # before DNS is set up; localhost because health checks and backup scripts
    # run on the machine itself and would otherwise hit the catch-all above and
    # get a closed connection — which reads as "the application is down".
    server_name feranocar.com www.feranocar.com 45.94.213.252 localhost;

    # Everything else — every location, header and limit — is shared with the
    # HTTPS server in site.inc, so the two can never disagree.
    include /etc/nginx/conf.d/site.inc;
}

# TLS lives in ssl.conf, which deploy/enable-ssl.sh writes after certbot
# succeeds — nginx refuses to start when told to load a certificate file that
# does not exist yet, so the HTTPS block cannot ship in a file that is always
# loaded. Run:  /opt/feranocar/deploy/enable-ssl.sh

