# The database panel, on its own port, behind its own lock.
#
# Layer one is this vhost's Basic Auth: nginx demands a username and password
# before a single byte of Adminer is served, and the credentials live only in
# .htpasswd on the server (created in docs/deployment.md — never committed;
# update.sh knows to leave the file alone). Layer two is Adminer's own login,
# which needs the real database password from .env. Layer three is the rate
# limit below, which turns a password-guessing run from thousands of tries a
# minute into ten.
#
# If nginx refuses to start after an update, the likely cause is that
# .htpasswd does not exist yet — the setup step in the guide creates it.

# Counted per client address, across both gates.
limit_req_zone $binary_remote_addr zone=dbpanel:1m rate=10r/m;

server {
    listen 8443;
    server_name _;
    server_tokens off;

    # A generous burst so a legitimate session (one page, several assets)
    # does not trip the limit that exists for guessing runs.
    limit_req zone=dbpanel burst=30 nodelay;

    auth_basic "Database";
    auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

    # Optional third layer: if your own internet connection has a stable
    # address or range, uncomment and set it — then even the password prompt
    # is unreachable from anywhere else. Left off by default because most
    # home connections in Iran change address.
    # allow 5.112.0.0/16;
    # deny all;

    location / {
        proxy_pass http://adminer:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 64m;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# After the SSL certificate exists (deployment step 7), switch this port to
# HTTPS so the two passwords stop travelling in clear text: replace
# `listen 8443;` above with the three lines below and reload nginx.
#
#     listen 8443 ssl;
#     ssl_certificate     /etc/letsencrypt/live/feranocar.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/feranocar.com/privkey.pem;
#
# and from then on open it as https://feranocar.com:8443
# ─────────────────────────────────────────────────────────────────────────────
