# Whether plain HTTP should redirect to HTTPS.
#
# This one line is the switch between "no certificate yet" and "TLS is live",
# and it exists as a variable rather than as an edit to app.conf for a reason:
# app.conf keeps receiving improvements with every update, so it must stay a
# file the update overwrites freely. This file does not — enable-ssl.sh rewrites
# it, and update.sh leaves it alone.
#
# Loaded first (00-) so the variable is defined before app.conf refers to it.
#
#   0 = serve over HTTP (before the certificate exists)
#   1 = redirect everything to HTTPS
map $host $force_https {
    default 0;
}
