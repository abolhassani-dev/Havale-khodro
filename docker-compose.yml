# The whole system: nginx, the API, and PostgreSQL.
#
#   cp .env.example .env      # fill in the secrets it asks for
#   docker compose up -d --build
#
# One file for staging and for production. A staging environment that differs
# from production only tells you about staging.

# ── Two settings repeated on every service, and why ──────────────────────────
#
# logging: Docker's json-file driver keeps every line forever by default. On a
#   server that runs for a year, container logs are the single most likely
#   thing to fill the disk — and a full disk stops Postgres writing, which
#   takes the whole system down. The cause is invisible from the application:
#   nothing is wrong with it, there is simply nowhere left to write. Three
#   files of 10MB each is a few days of history per service and a hard ceiling
#   of 30MB, which cannot become the reason the site is down.
#
# mem_limit: without one, a leak or a heavy query grows until the *kernel*
#   picks a process to kill, and it picks the biggest — which is Postgres.
#   That is the "database went away for no reason" outage, and it is
#   unattributable after the fact because the log just stops. With a limit,
#   the container that misbehaves is the one that dies, it dies with a clear
#   OOM status, and the restart policy brings it back. Values are generous for
#   this workload and overridable in .env if the server changes.
x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: ${WEB_MEM_LIMIT:-128m}
    ports:
      - '80:80'
      - '443:443'
      # The database panel, behind its own password (see adminer.conf).
      - '8443:8443'
    volumes:
      # Read-only: nginx has no reason to write to the application it serves,
      # and a container that cannot write cannot be used to plant a file.
      #
      # Both of these are bound to the *directory*, resolved once when the
      # container is created. Replacing ./frontend on disk — mv the old one
      # aside, extract a new one in its place — leaves this container attached
      # to the old directory, and deleting that one leaves it attached to
      # nothing. nginx then answers the home page with 403, because the
      # document root it can see has no index.html in it.
      #
      # Update with deploy/update.sh, which changes the files inside these
      # directories instead of replacing the directories.
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx:/etc/nginx/conf.d:ro
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - api
    networks: [appnet]

  api:
    build:
      context: ./backend
      args:
        # Where npm fetches packages from. The default is the official
        # registry; set NPM_REGISTRY in .env to point at a mirror on a server
        # whose route to npmjs.org is unreliable — every tarball is still
        # checked against the integrity hash in package-lock.json, so a mirror
        # cannot serve anything the lockfile did not describe.
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    logging: *logging
    # Room for the workers below: each Node process carries its own heap and
    # runtime, and two of them under the old 512m ceiling would have been one
    # busy afternoon away from the kernel killing the container.
    mem_limit: ${API_MEM_LIMIT:-640m}
    env_file: .env
    environment:
      # Built from the same credentials the database container uses, so the two
      # cannot drift apart. A connection string in one place and a password in
      # another is how a stack comes up unable to reach its own database.
      # The pool settings are explicit rather than left to Prisma's default of
      # cores*2+1, because that default is derived from the machine it happens
      # to boot on — three cores here, a different number after any resize, and
      # the database's behaviour under load quietly changes with it.
      #
      #   connection_limit  ten is far more than this workload uses and far
      #                     below Postgres's default max_connections of 100,
      #                     so the API can never be the reason the database
      #                     refuses new connections.
      #   pool_timeout      a request that cannot get a connection in twenty
      #                     seconds should fail and free its socket, not wait
      #                     indefinitely behind whatever is stuck.
      #   connect_timeout   without it, opening a connection to a database that
      #                     is restarting can hang for the OS TCP timeout —
      #                     minutes — which turns a five-second restart into a
      #                     long outage for anyone unlucky enough to click.
      DATABASE_URL: postgresql://${POSTGRES_USER:-havale}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-havale}?schema=public&connection_limit=10&pool_timeout=20&connect_timeout=10
      # Kept below mem_limit on purpose. V8 only runs a full garbage collection
      # when it approaches its heap limit, so without this it happily grows
      # past the container's ceiling and gets killed by the kernel with no
      # warning. Told the real budget, it collects instead of dying.
      #
      # A ceiling for the whole API: server.js divides it between the workers
      # when there is more than one, so raising WEB_CONCURRENCY cannot quietly
      # multiply the memory this container may use.
      NODE_OPTIONS: --max-old-space-size=384
      # Processes serving the API. One, measured rather than assumed.
      #
      # The reasoning for more was that Node runs JavaScript on one thread and
      # this machine has three cores. Measuring it said otherwise: a single
      # process already used 179% of a core, because Prisma's query engine is a
      # Rust library with its own threads — the cores were never idle. A second
      # worker added no throughput, doubled the connection pool, pushed
      # Postgres from 46% to a full core, and took p95 from 367ms to 510ms by
      # oversubscribing three cores between the API, the database and nginx.
      #
      # Kept as a setting rather than deleted: on a machine with more cores it
      # is the right lever. Set WEB_CONCURRENCY in .env there.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    # No published port: the API is reachable through nginx and from nowhere
    # else. Publishing 3000 would leave a second door with no TLS on it.
    expose:
      - '3000'
    volumes:
      # Ticket attachments. A named volume, not the image's filesystem — a
      # redeploy replaces the container and must not take the files with it.
      - uploads:/app/uploads
      # The audit-trail archive: rows the nightly job writes out before it
      # removes them from the database.
      #
      # A host path rather than a named volume, and one outside the project
      # directory. Outside, because deploy/update.sh brings the project
      # directory back in line with the repository on every update — an archive
      # kept in there would vanish one evening as a side effect of deploying.
      # A host path, because deploy/backup.sh already collects /var/backups and
      # somebody investigating an old dispute should be able to reach these
      # files with zcat and jq rather than through Docker.
      - ${ACTIVITY_ARCHIVE_DIR:-/var/backups/feranocar/activity}:/archive
    depends_on:
      db:
        condition: service_healthy
    networks: [appnet]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: ${DB_MEM_LIMIT:-1g}
    # Postgres puts index builds and sorts here, and the Docker default is a
    # 64MB /dev/shm. A query that needs more fails with "could not resize
    # shared memory segment" — an error that reads like a broken database and
    # is a container setting.
    shm_size: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-havale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-havale}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-havale} -d ${POSTGRES_DB:-havale}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [appnet]

  # Database administration — Adminer, the phpMyAdmin equivalent for Postgres.
  #
  # No published port of its own: everything goes through nginx on :8443,
  # which demands its own username and password (deploy/nginx/adminer.conf)
  # before Adminer even loads, and rate-limits the attempts. A database
  # panel exposed directly is what automated scanners hunt for all day —
  # this way the panel itself is never the first line of defence.
  adminer:
    image: adminer:4
    restart: unless-stopped
    logging: *logging
    mem_limit: ${ADMINER_MEM_LIMIT:-128m}
    expose:
      - '8080'
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    networks: [appnet]

  # Renewal runs from cron on the host (see docs/deployment.md). This service
  # exists so the first certificate can be issued with one command.
  certbot:
    image: certbot/certbot:latest
    profiles: ['certs']
    # The host's network, not Docker's.
    #
    # Docker gives containers an embedded resolver that forwards to whatever
    # the daemon was told to use, and on this server that path could not
    # resolve Let's Encrypt at all while the host resolved it every time. The
    # difference is not worth debugging twice a year: certbot needs exactly
    # one thing from the network — to reach the ACME API — and the host can
    # already do that. It binds no port, so sharing the host network costs
    # nothing and removes a whole class of failure from certificate renewal,
    # which runs unattended and whose failure is silent until the site breaks.
    network_mode: host
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: ['/bin/sh', '-c']
    command: ['echo "run: docker compose run --rm certbot certonly ..."']

networks:
  appnet:
    driver: bridge

volumes:
  dbdata:
  uploads:
  certbot-webroot:
  certbot-certs:
