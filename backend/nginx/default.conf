# nginx in front of everything.
#
# It serves the frontend as static files and proxies only /api to Node. Routing
# everything through the application would put the event loop in the path of
# every stylesheet and font request for no benefit.
#
# TLS is not configured here: certbot writes its own listener block when the
# certificate is issued on the server. Putting a half-written TLS block in the
# repository only invites somebody to launch with it.

upstream api {
    server api:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    # Do not advertise the version — free information for an attacker.
    server_tokens off;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ---- security headers ----
    #
    # The Content-Security-Policy is the second line of defence behind the
    # escaping in ui/html.js: even if a script tag were injected, the browser
    # would refuse to run it. `unsafe-inline` is absent from script-src on
    # purpose — nothing in this frontend uses an inline script or an onclick
    # attribute, so allowing them would only weaken this for no gain.
    #
    # style-src keeps 'unsafe-inline' because the markup uses a handful of inline
    # style attributes. Those cannot execute code.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # No third-party embedding: this panel has no business inside somebody
    # else's page, and clickjacking a "suspend account" button is easy money.
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /api/v1/health {
        proxy_pass http://api/api/v1/health;
        access_log off;
    }

    # Fingerprinted assets never change under the same name, so they can be held
    # for a year. The font in particular is 110 KB that should be fetched once.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application code is small and changes on every deploy. Caching it would
    # mean an agency running last week's interface against this week's API.
    location /src/ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
