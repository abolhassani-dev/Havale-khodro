# The whole system in one command, on any machine with Docker.
#
#   cp .env.docker.example .env  &&  docker compose up --build
#
# Used for the staging box the team clicks around in, and for production later —
# the same file either way, because a staging environment that differs from
# production only tells you about staging.

services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file: .env
    environment:
      # Built from the same credentials the database container uses, so the two
      # cannot drift apart. Hard-coding a connection string in one place and the
      # password in another is how a stack comes up with the app unable to reach
      # its own database.
      DATABASE_URL: postgresql://${POSTGRES_USER:-havale}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-havale}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks: [appnet]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-havale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-havale}
    volumes:
      - dbdata:/var/lib/postgresql/data
    # No published port. The database is reachable from the api container and
    # from nowhere else — a Postgres exposed to the internet with a password
    # somebody chose in a hurry is found by scanners within the day.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-havale} -d ${POSTGRES_DB:-havale}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [appnet]

networks:
  appnet:
    driver: bridge

volumes:
  dbdata:
